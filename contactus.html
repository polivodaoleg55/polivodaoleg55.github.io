<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agridera - Contact Us</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
</head>
<body>

    <header class="container py-3">
        <div class="row align-items-center">
            <div class="col-md-4">
                <img src="images/logo.png" alt="Agridera Logo" class="img-fluid header-logo">
            </div>
            <div class="col-md-8">
                <div class="d-flex justify-content-end mb-2">
                    <form class="search-form">
                        <input type="text" placeholder="Search" class="search-input">
                        <button type="submit" class="search-btn">
                            <i class="fa fa-search"></i>
                        </button>
                    </form>
                </div>
                <nav class="nav justify-content-end">
                    <a class="nav-link text-dark" href="index.html">Home</a>
                    <a class="nav-link text-dark" href="#">Company Profile</a>
                    <a class="nav-link text-dark" href="tomato.html">Products</a>
                    <a class="nav-link text-dark" href="#">Services</a>
                    <a class="nav-link text-dark" href="#">R & D</a>
                    <a class="nav-link text-success font-weight-bold" href="contactus.html">Contact</a>
                </nav>
            </div>
        </div>
    </header>
    <section class="tomato-banner" style="background-image: url('images/contact_banner.jpg'); min-height: 350px;">
    </section>
    <main class="container my-5">
        <h1 class="font-weight-bold" style="color: #324950;">Contact us</h1>
        <div class="text-success mb-4">*****</div>

        <form action="#">
            <div class="row">
                <div class="col-md-5">
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">Name *</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">Company Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">Position</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">City</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">Country</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">Telephone</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="d-block text-dark small font-weight-bold">Email *</label>
                        <input type="email" class="form-control">
                    </div>
                </div>

                <div class="col-md-7">
    <div class="mb-3">
        <label class="d-block text-dark small font-weight-bold">You are a</label>
        <select class="form-control">
            <option>seed producer</option>
            <option>grower</option>
            <option>distributor</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="d-block text-dark small font-weight-bold">If other, please specify</label>
        <input type="text" class="form-control">
    </div>
    <div class="mb-3">
        <label class="d-block text-dark small font-weight-bold">You are interested in</label>
        <textarea class="form-control" rows="11"></textarea>
    </div>

    <div class="mt-4">
        <label class="d-block text-dark small font-weight-bold mb-2">Please type this code</label>

        <div class="d-flex align-items-center justify-content-between flex-wrap">
            <div class="d-flex align-items-center mb-3">
                <div class="mr-3">
                    <img src="images/captcha.png" alt="Captcha Code" class="img-fluid" style="max-height: 35px;">
                </div>
                <input type="text" class="form-control" required style="width: 130px; height: 40px; border-radius: 5px;">
            </div>

            <div class="mb-3">
                <button type="submit" class="btn btn-success font-weight-bold px-5" style="border-radius: 25px; height: 45px; background-color: #5cb85c; border: none;">
                    Send Message
                </button>
            </div>
        </div>
    </div>
</div>
            </div>
        </form>

        <div class="row mt-5 text-center">
            <div class="col-12">
                <h5 class="text-success font-weight-bold border-bottom d-inline-block pb-2 mb-3" style="border-bottom: 2px solid #28a745 !important;">Our Address</h5>
                <div style="color: #435b61;">
                    <p class="mb-1">AGRIDERA Seeds & Agriculture Ltd.</p>
                    <p class="mb-1">P.O Box 103,</p>
                    <p class="mb-1">Gedera 70750, Israel.</p>
                    <p>Telephone: <span class="text-success font-weight-bold">+972 8 944 9222</span></p>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer-bg py-3 mt-5">
        <div class="container d-flex justify-content-between align-items-center flex-wrap">
            <div class="footer-links">
                <a href="#" class="text-white px-2 small">PROFILE</a>
                <a href="#" class="text-white px-2 small">MANAGEMENT</a>
                <a href="#" class="text-white px-2 small">PRODUCTS</a>
                <a href="#" class="text-white px-2 small">R&D</a>
                <a href="#" class="text-white px-2 small">LINKS</a>
                <a href="#" class="text-white px-2 small">SITEMAP</a>
                <a href="#" class="text-white px-2 small">CONTACT</a>
            </div>
            <div class="social-icons">
                <a href="#" class="text-white mx-1"><i class="fab fa-linkedin-in"></i></a>
                <a href="#" class="text-white mx-1"><i class="fab fa-facebook-f"></i></a>
                <a href="#" class="text-white mx-1"><i class="fab fa-youtube"></i></a>
                <a href="#" class="text-white mx-1"><i class="fab fa-twitter"></i></a>
                <a href="#" class="text-white mx-1"><i class="fab fa-instagram"></i></a>
            </div>
        </div>
        <div class="container text-center mt-3">
            <p class="copyright-text mb-0">AGRIDERA SEEDS & AGRICULTURE LTD. © 2020</p>
        </div>
    </footer>

</body>
</html>
